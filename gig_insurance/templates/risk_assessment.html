<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Risk Assessment</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Poppins',sans-serif;
    background:#0b0f1a;
    color:white;
    overflow-x:hidden;
}

#particles-js{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
}

.container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.card{
    width:450px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    border:1px solid rgba(0,255,255,0.3);
    box-shadow:0 0 40px rgba(0,255,255,0.3);
}

.card h2{
    text-align:center;
    margin-bottom:30px;
    font-family:'Orbitron',sans-serif;
    background:linear-gradient(90deg,#00f5ff,#00ff9d);
    background-clip:text;
    -webkit-background-clip:text;
    color:transparent;
}

.input-group{
    margin-bottom:20px;
}

.input-group input, select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.1);
    color:darkblack;
}

.btn{
    width:100%;
    padding:12px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    font-weight:600;
    background:linear-gradient(90deg,#00f5ff,#00ff9d);
    box-shadow:0 0 20px rgba(0,255,255,0.6);
    transition:0.4s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(0,255,255,1);
}

.result{
    margin-top:20px;
    text-align:center;
    font-size:18px;
}
</style>
</head>

<body>

<div id="particles-js"></div>

<div class="container">
<div class="card">

<h2>AI Risk Assessment</h2>

<form method="POST" action="{{ url_for('risk_assessment') }}">

<div class="input-group">
<input type="number" name="age" placeholder="Age" required>
</div>

<div class="input-group">
<input type="number" name="experience" placeholder="Years of Experience" required>
</div>

<div class="input-group">
<select name="job_type" required>
<option value="">Select Job Type</option>
    <option value="1">Delivery Partner</option>
<option value="2">Ride Share Driver</option>
<option value="3">Freelancer</option>
</select>
</div>

<div class="input-group">
<input type="number" name="working_hours" placeholder="Daily Working Hours" required>
</div>

<button type="submit" class="btn">Predict Risk</button>

</form>

{% if risk_score %}
<div class="result">
<p>Risk Score: {{ risk_score }}%</p>
<p>Suggested Premium: ₹{{ premium }}</p>
</div>
{% endif %}

</div>
</div>

<script>
particlesJS("particles-js",{
particles:{number:{value:80},size:{value:3},move:{speed:2},line_linked:{enable:true}}
});
</script>

</body>
</html>
