<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Policy</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Poppins',sans-serif;
    background:#0b0f1a;
    color:white;
    overflow-x:hidden;
}

#particles-js{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
}

.container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.card{
    width:500px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    border:1px solid rgba(0,255,255,0.3);
    box-shadow:0 0 40px rgba(0,255,255,0.3);
    text-align:center;
}

.card h2{
    margin-bottom:20px;
    font-family:'Orbitron',sans-serif;
    background:linear-gradient(90deg,#00f5ff,#00ff9d);
        background-clip:text;

    -webkit-background-clip:text;
    color:transparent;
}

.plan{
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    background:rgba(0,255,255,0.1);
}

.btn{
    margin-top:25px;
    padding:12px 25px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    font-weight:600;
    background:linear-gradient(90deg,#00f5ff,#00ff9d);
    box-shadow:0 0 20px rgba(0,255,255,0.6);
    transition:0.4s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(0,255,255,1);
}
</style>
</head>

<body>

<div id="particles-js"></div>

<div class="container">
<div class="card">

<h2>AI Generated Insurance Plan</h2>

<div class="plan">
<p><strong>Risk Level:</strong> {{ risk_level }}</p>
<p><strong>Monthly Premium:</strong> ₹{{ premium }}</p>
<p><strong>Coverage Amount:</strong> ₹{{ coverage }}</p>
<p><strong>Benefits:</strong></p>
<ul style="list-style:none;margin-top:10px;">
<li>✔ Accident Coverage</li>
<li>✔ Income Protection</li>
<li>✔ Medical Support</li>
<li>✔ Emergency Assistance</li>
</ul>
</div>

<a href="{{ url_for('dashboard') }}">
<button class="btn">Activate Policy</button>
<a href="{{ url_for('download_policy') }}">
    <button class="btn">Download Policy PDF</button>
</a>
</a>

</div>
</div>

<script>
particlesJS("particles-js",{
particles:{number:{value:80},size:{value:3},move:{speed:2},line_linked:{enable:true}}
});
</script>

</body>
</html>
