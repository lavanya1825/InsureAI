<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InsureAI -  Register</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Poppins',sans-serif;
    background:#0b0f1a;
    color:white;
    overflow:hidden;
}

#particles-js{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
}

.container{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.auth-box{
    width:380px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    border:1px solid rgba(0,255,255,0.2);
    box-shadow:0 0 40px rgba(0,255,255,0.3);
    position:relative;
    overflow:hidden;
}

.auth-box h2{
    text-align:center;
    margin-bottom:25px;
    font-family:'Orbitron',sans-serif;
    background:linear-gradient(90deg,#00f5ff,#00ff9d);
    background-clip:text;
    -webkit-background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
}

.input-group{
    margin-bottom:20px;
}

.input-group input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.1);
    color:white;
}

.input-group input::placeholder{
    color:#cbd5e1;
}

.btn{
    width:100%;
    padding:12px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    font-weight:600;
    background:linear-gradient(90deg,#00f5ff,#00ff9d);
    box-shadow:0 0 20px rgba(0,255,255,0.6);
    transition:0.4s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(0,255,255,1);
}

.toggle-text{
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

.toggle-text span{
    color:#00ffcc;
    cursor:pointer;
}

.hidden{display:none}

@media(max-width:420px){
    .auth-box{width:90%}
}
</style>
</head>

<body>
<div id="particles-js"></div>

<div class="container">

<div class="auth-box">

<!-- Register Form -->
<form method="POST" action="{{ url_for('register') }}">

    <h2>Register</h2>

    <div class="input-group">
        <input type="text" name="fullname" placeholder="Full Name" required>
    </div>

    <div class="input-group">
        <input type="email" name="email" placeholder="Email" required>
    </div>

    <div class="input-group">
        <input type="password" name="password" placeholder="Password" required>
    </div>

    <button type="submit" class="btn">Create Account</button>

    <p class="toggle-text">
        Already have an account?
        <a href="{{ url_for('login') }}" style="color:#00ffcc;">Login</a>
    </p>

</form>
</div>
</div>

<script>
particlesJS("particles-js",{
    particles:{number:{value:70},size:{value:3},move:{speed:2},line_linked:{enable:true}}
});

</script>

</body>
</html>
