<!DOCTYPE html>
<html>
<head>
<title>Submit Claim</title>
</head>
<body style="background:#0b0f1a;color:white;text-align:center;padding:40px;">

<h2>Submit Insurance Claim</h2>

<form method="POST">

<select name="claim_type" required>
<option value="">Select Claim Type</option>
<option value="Accident">Accident</option>
<option value="Medical">Medical</option>
<option value="Income Loss">Income Loss</option>
</select>

<br><br>

<textarea name="description" placeholder="Describe incident" required></textarea>

<br><br>

<input type="number" name="amount" placeholder="Claim Amount" required>

<br><br>

<button type="submit">Submit Claim</button>

</form>

</body>
</html>
